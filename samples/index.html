<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project expectation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <figure> <img src="bmp-source.bmp" alt="Original">
        <figcaption>Original</figcaption>
    </figure>
    <section>
        <h2>Filters</h2>
        <figure> <img class="grayscale" src="bmp-source.bmp" alt="Grayscale">
            <figcaption>Grayscale</figcaption>
        </figure>
        <figure> <img class="inversion-color" src="bmp-source.bmp" alt="Invert">
            <figcaption>Invert</figcaption>
        </figure>
    </section>
    <section>
        <h2>Rotation</h2>
        <figure> <img class="rotation-90" src="bmp-source.bmp" alt="Rotate 90">
            <figcaption>Rotate 90°</figcaption>
        </figure>
        <figure> <img class="rotation-180" src="bmp-source.bmp" alt="Rotate 180">
            <figcaption>Rotate 180°</figcaption>
        </figure>
        <figure>
            <img class="rotation-270" src="bmp-source.bmp" alt="Rotate 270">
            <figcaption>Rotate 270°</figcaption>
        </figure>
    </section>
    <section>
        <h2>Scaling</h2>
        <figure> <img class="scaling-1-param" src="bmp-source.bmp" alt="Scale 1 param">
            <figcaption>Scale(1.4)</figcaption>
        </figure>
        <figure> <img class="scaling-2-params" src="bmp-source.bmp" alt="Scale 2 param">
            <figcaption>Scale(1.3, 0.4)</figcaption>
        </figure>
    </section>
    <section>
        <h2>Skew</h2>
        <figure> <img class="skewing-1-param" src="bmp-source.bmp" alt="Skew 1 param">
            <figcaption>Skew (30deg)</figcaption>
        </figure>
        <figure> <img class="skewing-2-params" src="bmp-source.bmp" alt="Skew 2 params">
            <figcaption>Skew (-15deg, 30deg)</figcaption>
        </figure>
    </section>
</body>

</html>
